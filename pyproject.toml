[project]
name = "local-multimodal-agent"
version = "0.1.0"
description = "Local multimodal agent over an OpenAI-compatible backend"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
app = [
    "httpx>=0.28",
    "pydantic-settings>=2.6",
]
# LangGraph pulls langchain-core in transitively. Being installed is not
# permission to import it; see DECISIONS.md.
agent = [
    "langgraph>=1.2",
]
ui = [
    "chainlit>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
